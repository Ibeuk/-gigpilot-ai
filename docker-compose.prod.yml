version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gigpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigpilot_prod_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gigpilot_ai}
    ports: []   # No external port exposed in production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis:
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-gigpilot_redis_pass_2026}
    ports: []   # No external port exposed in production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gigpilot}:${POSTGRES_PASSWORD:-gigpilot_prod_pass_2026}@postgres:5432/${POSTGRES_DB:-gigpilot_ai}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gigpilot_redis_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-prod-jwt-secret-key-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod-refresh-secret-key-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: 3001
    ports: []   # Nginx reverse proxy handles external traffic
    volumes: [] # No source mounts in production
    command: node dist/main.js
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
      restart_policy:
        condition: any
        delay: 5s
        window: 60s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:3001}
    ports: []
    volumes: []
    command: npm run start
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ─── Nginx Reverse Proxy ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gigpilot-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

volumes:
  nginx_logs:
    driver: local
