services:
  # ─── 1. Next.js Frontend Dashboard ───────────────────────
  - type: web
    name: gigpilot-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 3000

  # ─── 2. NestJS Backend API ──────────────────────────────
  - type: web
    name: gigpilot-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: gigpilot-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: gigpilot-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: gigpilot-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 3001

  # ─── 3. Redis Queue / Cache Service ─────────────────────
  - type: redis
    name: gigpilot-redis
    region: oregon
    plan: free
    ipAllowList: []

databases:
  # ─── 4. PostgreSQL Database ──────────────────────────────
  - name: gigpilot-db
    region: oregon
    plan: free
    databaseName: gigpilot_ai
    user: gigpilot
